trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
    addToPath: true

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest
  displayName: 'Install dependencies'

- script: |
    pytest
  displayName: 'Run tests'

- script: |
    echo "Hello World Pipeline executed successfully!"
  displayName: 'Hello World Success'

