trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: GoTool@0
  inputs:
    version: '1.20'
    addToPath: true

- script: |
    go mod download
  displayName: 'Download Go dependencies'

- script: |
    go build -o myapp
  displayName: 'Build Go application'

- script: |
    go test -v ./...
  displayName: 'Run tests'

- script: |
    echo "Hello World Pipeline executed successfully!"
  displayName: 'Hello World Success'

